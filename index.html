<!doctype html>
<html lang="en">

      name="description"

    <!--
      TK-ORIGIN is a placeholder, not a domain. No production origin has been
      supplied, and og:url / og:image must be absolute for every crawler worth
      having. scripts/check-tk.mjs fails while it is still here.
    -->
    <link rel="canonical" href="TK-ORIGIN/" />
    <meta name="theme-color" content="#715f47" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="223 Waverly Avenue" />
    <meta property="og:title" content="223 Waverly Avenue — Clinton Hill, Brooklyn" />
    <meta
      property="og:description"
      content="A new four-storey house in the Clinton Hill Historic District, Brooklyn, in terracotta and brick. Architecture by StudioSC."
    />
    <meta property="og:url" content="TK-ORIGIN/" />
    <meta property="og:image" content="TK-ORIGIN/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:description"
      content="A new four-storey house in the Clinton Hill Historic District, Brooklyn, in terracotta and brick."
    />
    <meta name="twitter:image" content="TK-ORIGIN/og-image.jpg" />

    <!-- The hero is the only image worth preloading: it is the first paint. -->

          imagesrcset="/img/portrait/00-hero-390.avif 390w, /img/portrait/00-hero-640.avif 640w" imagesizes="100vw" />
    <link rel="preload" as="image" type="image/avif" media="(min-width: 650px)"
          imagesrcset="/img/landscape/00-hero-640.avif 640w, /img/landscape/00-hero-1024.avif 1024w, /img/landscape/00-hero-1440.avif 1440w, /img/landscape/00-hero-1920.avif 1920w, /img/landscape/00-hero-2440.avif 2440w" imagesizes="100vw" />
